name: Contribution Graph Generation

on:
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  contribution-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution heatmap
        run: python scripts/generate_heatmap.py

      - name: Commit heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate contribution heatmap"
          file_pattern: "assets/heatmap.svg"
