name: LeetCode Stats Refresh

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-leetcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Record LeetCode widget metadata
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          assets = Path("assets")
          assets.mkdir(exist_ok=True)
          payload = {
              "username": "Gagan747",
              "card": "https://leetcard.jacoblin.cool/Gagan747?theme=dark&font=Inter&ext=contest",
              "heatmap": "https://leetcard.jacoblin.cool/Gagan747?theme=dark&font=Inter&ext=heatmap",
              "refreshed_at": datetime.now(timezone.utc).isoformat()
          }
          (assets / "leetcode_stats.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY

      - name: Commit LeetCode metadata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh LeetCode stats metadata"
          file_pattern: "assets/leetcode_stats.json"
